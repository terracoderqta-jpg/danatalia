<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Administración | Dana Talía</title>
    <link
      href="config.yml?v=20260816"
      type="text/yaml"
      rel="cms-config-url"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --dt-bg: #f4f6f8;
        --dt-surface: #ffffff;
        --dt-border: #e5e8eb;
        --dt-text: #1c2333;
        --dt-text-secondary: #8a94a6;
        --dt-muted: #b6bdc9;
        --dt-turquoise: #12b5b0;
        --dt-turquoise-dark: #0e9a96;
        --dt-turquoise-soft: #e4f7f6;
        --dt-danger: #e8554d;
        --dt-sidebar: #2a2f45;
        --dt-sidebar-text: #cdd3e0;
      }

      /* Fondo general y tipografía base */
      ::selection { background: var(--dt-turquoise-soft); }

      body {
        font-family: "Inter", system-ui, sans-serif !important;
        background: var(--dt-bg) !important;
        color: var(--dt-text) !important;
        letter-spacing: -0.01em;
      }

      .nc-background,
      .nc-page-container,
      .nc-appMain-container,
      .nc-collectionPage-container,
      .nc-controlPane-container,
      .nc-settingsPage-container,
      .nc-workflowPage-container {
        background: var(--dt-bg) !important;
        font-family: "Inter", sans-serif !important;
      }

      /* Encabezado superior */
      .nc-header {
        background: var(--dt-surface) !important;
        border-bottom: 1px solid var(--dt-border) !important;
      }
      .nc-headerLink__Title,
      .nc-headerLink,
      .nc-header-link,
      .nc-toolbar-title {
        font-family: "Inter", sans-serif !important;
        color: var(--dt-text) !important;
        font-weight: 800 !important;
        letter-spacing: -0.02em;
      }

      /* Barra lateral */
      .nc-sidebar-container,
      .nc-sideNav-container {
        background: var(--dt-sidebar) !important;
      }
      .nc-sideNav-link,
      .nc-sideNav-link__text {
        color: var(--dt-sidebar-text) !important;
        font-family: "Inter", sans-serif !important;
        border-radius: 8px !important;
        margin: 1px 8px !important;
        padding: 8px 12px !important;
      }
      .nc-sideNav-link--active,
      .nc-sideNav-link:hover {
        background: rgba(18, 181, 176, 0.18) !important;
        color: #6fe3df !important;
      }
      .nc-collectionPage-topbar {
        border-bottom: 1px solid var(--dt-border) !important;
        background: var(--dt-surface) !important;
      }

      /* Títulos y etiquetas */
      h1, h2, h3, h4,
      .nc-entryCardTitle,
      .nc-collectionPage-title,
      .nc-fieldLabel,
      .nc-controlPane-label,
      .nc-sectionLabel {
        font-family: "Inter", sans-serif !important;
        color: var(--dt-text) !important;
        letter-spacing: -0.02em;
      }
      .nc-fieldLabel,
      .nc-controlPane-label {
        font-family: "Inter", sans-serif !important;
        font-weight: 600 !important;
        letter-spacing: 0 !important;
        text-transform: none !important;
        font-size: 0.8rem !important;
        color: var(--dt-text) !important;
      }

      /* Tarjetas de entradas */
      .nc-entryCard-container,
      .nc-cardMain,
      .nc-card {
        background: var(--dt-surface) !important;
        border: 1px solid var(--dt-border) !important;
        border-radius: 12px !important;
        box-shadow: 0 1px 2px rgba(16, 22, 38, 0.04) !important;
        transition: border-color 0.15s ease, box-shadow 0.15s ease !important;
      }
      .nc-entryCard-container:hover,
      .nc-card:hover {
        border-color: var(--dt-turquoise) !important;
        box-shadow: 0 6px 20px rgba(18, 181, 176, 0.12) !important;
      }

      /* Botones */
      .nc-button,
      .nc-primaryButton,
      .nc-btn--primary,
      .nc-toolbar-save,
      .nc-collectionToolbar-last {
        background: var(--dt-turquoise) !important;
        color: #fff !important;
        border: none !important;
        border-radius: 10px !important;
        font-family: "Inter", sans-serif !important;
        font-weight: 600 !important;
        letter-spacing: 0 !important;
      }
      .nc-button:hover,
      .nc-primaryButton:hover,
      .nc-toolbar-save:hover {
        background: var(--dt-turquoise-dark) !important;
      }
      .nc-button--gray,
      .nc-secondaryButton {
        background: transparent !important;
        border: 1px solid var(--dt-border) !important;
        color: var(--dt-text) !important;
      }

      /* Campos de formulario */
      .nc-controlPane-container input,
      .nc-controlPane-container textarea,
      .nc-controlPane-container select,
      .nc-widget input,
      .nc-widget textarea,
      .nc-widget select {
        font-family: "Inter", sans-serif !important;
        border: 1px solid var(--dt-border) !important;
        border-radius: 10px !important;
        background: var(--dt-surface) !important;
        color: var(--dt-text) !important;
        padding: 9px 12px !important;
      }
      .nc-controlPane-container input:focus,
      .nc-controlPane-container textarea:focus,
      .nc-controlPane-container select:focus {
        outline: none !important;
        border-color: var(--dt-turquoise) !important;
        box-shadow: 0 0 0 3px rgba(18, 181, 176, 0.12) !important;
      }

      /* Imágenes: borde suave */
      .nc-imageControl-image {
        border-radius: 12px !important;
        border: 1px solid var(--dt-border) !important;
      }

      /* Enlaces (config / crear nuevo) */
      a, .nc-link {
        color: var(--dt-turquoise) !important;
      }

      /* Página de login */
      .nc-auth-page,
      .nc-authPage-container,
      .nc-loginBody {
        background: linear-gradient(160deg, var(--dt-bg) 0%, var(--dt-turquoise-soft) 100%) !important;
      }
      .nc-loginButton {
        background: var(--dt-turquoise) !important;
        color: #fff !important;
        border: none !important;
        border-radius: 10px !important;
        font-family: "Inter", sans-serif !important;
        font-weight: 600 !important;
      }
      .nc-loginButton:hover {
        background: var(--dt-turquoise-dark) !important;
      }
      .nc-loginBox, .nc-loginCard {
        background: var(--dt-surface) !important;
        border-radius: 16px !important;
        box-shadow: 0 16px 48px rgba(16, 22, 38, 0.12) !important;
      }

      /* Modal / media library */
      .nc-modal {
        border-radius: 16px !important;
        background: var(--dt-surface) !important;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
