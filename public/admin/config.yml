# Configuración de Decap CMS para el sitio de Dana Talía
# Admin disponible en https://danatalia.pages.dev/admin/

backend:
  name: github
  repo: terracoderqta-jpg/danatalia
  branch: main
  base_url: https://danatalia.pages.dev
  auth_endpoint: /api/auth

# Idioma de la interfaz del panel
locale: es

# Las fotos subidas desde el admin se guardan en public/uploads y
# el sitio las sirve en /uploads/...
media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://danatalia.pages.dev
display_url: https://danatalia.pages.dev
logo_url: /logo.png

# Desactiva los enlaces de "vista previa de deploy" (los elementos no tienen página propia)
show_preview_links: false

# Desactiva la vista previa del editor para todas las colecciones
editor:
  preview: false

collections:
  # ============ BANNER ============
  - name: "banner"
    label: "Banner principal"
    label_singular: "Banner"
    files:
      - name: "banner_data"
        label: "Contenido del banner"
        file: "src/data/banner.json"
        editor:
          preview: false
        fields:
          - label: "Barra superior"
            name: "topBar"
            widget: "object"
            collapsed: true
            summary: "{{text}}"
            fields:
              - { label: "Texto", name: "text", widget: "string", required: false, hint: "Ej: 'Envíos a todo el país'. Vacío = no se muestra." }
              - { label: "Texto destacado", name: "highlight", widget: "string", required: false, hint: "Ej: 'Atención para revendedoras'. Vacío = no se muestra." }
          - { label: "Etiqueta 1 (opcional)", name: "badge1", widget: "string", required: false, hint: "Ej: 'Cruelty Free'. Vacío = oculta la etiqueta." }
          - { label: "Etiqueta 2 (opcional)", name: "badge2", widget: "string", required: false }
          - { label: "Título (primera parte)", name: "title", widget: "string", required: false, hint: "Texto principal grande. Ej: 'Maquillaje Corporal'." }
          - { label: "Título (segunda parte en turquesa)", name: "titleHighlight", widget: "string", required: false }
          - { label: "Subtítulo", name: "subtitle", widget: "text", required: false }
          - { label: "Foto principal del banner *", name: "heroImage", widget: "image", choose_url: true, required: false, hint: "La foto grande del banner. La tarjeta destacada se apoya sobre ella." }
          - { label: "Texto alternativo de la foto", name: "heroImageAlt", widget: "string", required: false }
          - label: "Tarjeta destacada (sobre la foto)"
            name: "featured"
            widget: "object"
            collapsed: true
            summary: "{{name}}"
            hint: "Texto que se ve abajo sobre la foto del banner. Si lo dejás vacío, no se muestra."
            fields:
              - { label: "Etiqueta", name: "label", widget: "string", required: false }
              - { label: "Nombre del producto", name: "name", widget: "string", required: false }
              - { label: "Descripción", name: "description", widget: "string", required: false }
          - label: "Tarjeta flotante"
            name: "floatingCard"
            widget: "list"
            min: 0
            max: 1
            summary: "{{fields.title}}"
            collapsed: true
            hint: "Tarjeta blanca flotante sobre el banner. Para ocultarla, borrá el único item."
            fields:
              - { label: "Título", name: "title", widget: "string", required: false }
              - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
              - { label: "Emoji", name: "emoji", widget: "string", required: false }
          - { label: "Sello flotante (opcional)", name: "floatingBadge", widget: "string", required: false, hint: "Sello dorado arriba a la derecha. Ej: 'Envío 24/48h'. Vacío = no se muestra." }
          - label: "Estadísticas (opcional)"
            name: "stats"
            widget: "list"
            summary: "{{fields.value}} {{fields.label}}"
            collapsed: true
            hint: "Números de la marca (ej: '+500 Clientes'). Si no cargás ninguno, no se muestra."
            fields:
              - { label: "Valor", name: "value", widget: "string", required: false }
              - { label: "Etiqueta", name: "label", widget: "string", required: false }

  # ============ BANNERS ADICIONALES ============
  # Varios banners que se colocan en distintas zonas de la página.
  # Cada banner es un archivo en src/data/banners/*.json
  - name: "banners-adicionales"
    label: "Banners adicionales"
    label_singular: "Banner"
    folder: "src/data/banners"
    create: true
    delete: true
    identifier_field: "slug"
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    summary: "{{image}}  {{name}}"
    description: "Creá banners y elegí en qué zona de la página se muestran."
    editor:
      preview: false
      frame: false
    fields:
      - { label: "Nombre interno", name: "name", widget: "string", hint: "Un nombre para reconocerlo en el panel. Ej: 'Promo invierno'.", required: false }
      - { label: "Enlace corto (slug) *", name: "slug", widget: "string", hint: "En minúsculas, sin espacios ni acentos. Ej: promo-invierno. Es obligatorio.", required: false }
      - label: "Ubicación en la página"
        name: "position"
        widget: "select"
        options:
          - { label: "Inicio (arriba del todo)", value: "inicio" }
          - { label: "Debajo de Categorías", value: "despues-categorias" }
          - { label: "Debajo de Productos", value: "despues-productos" }
          - { label: "Antes del Contacto", value: "antes-contacto" }
        hint: "Elegí dónde vas a mostrar este banner."
      - { label: "Activo", name: "active", widget: "boolean", default: true, hint: "Desactivá para ocultarlo sin borrarlo." }
      - { label: "Título", name: "title", widget: "string", required: false }
      - { label: "Subtítulo", name: "subtitle", widget: "text", required: false }
      - { label: "Texto del botón (opcional)", name: "ctaText", widget: "string", required: false, hint: "Ej: 'Ver colección'. Vacío = sin botón." }
      - { label: "Enlace del botón (opcional)", name: "ctaLink", widget: "string", required: false, hint: "Ej: #cosmetica o la página del producto." }
      - { label: "Foto del banner *", name: "image", widget: "image", choose_url: true, required: false, hint: "La imagen de fondo del banner. Recomendado: ancha (1600px aprox)." }

  # ============ CATEGORÍAS ============
  - name: "categorias"
    label: "Categorías"
    label_singular: "Categoría"
    folder: "src/data/categorias"
    create: true
    delete: true
    identifier_field: "key"
    format: "json"
    extension: "json"
    slug: "{{key}}"
    summary: "{{label}}"
    editor:
      preview: false
    fields:
      - { label: "Clave interna", name: "key", widget: "string", hint: "En minúsculas, sin espacios ni acentos. Ej: accesorios. No la cambies si la categoría ya tiene productos asignados.", required: false }
      - { label: "Nombre", name: "label", widget: "string", required: false }
      - { label: "Foto de la categoría", name: "image", widget: "image", choose_url: true, required: false }

  # ============ PRODUCTOS ============
  # Mismos archivos (src/data/productos), pero separados por categoría en el panel
  - name: "productos"
    label: "Productos — Todos"
    label_singular: "Producto"
    folder: "src/data/productos"
    create: true
    delete: true
    identifier_field: "slug"
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    summary: "{{image}}  {{name}} — ${{price}}"
    description: "Edita foto, precios, nombre y descripción de cada producto. Los cambios se publican solos al guardar."
    editor:
      preview: false
      frame: false
    fields: &producto_fields
      # --- Paso 1: lo esencial ---
      - { label: "Nombre del producto *", name: "name", widget: "string", hint: "El nombre que se muestra en la tienda. Ej: 'Crema Rosa Mosqueta'.", required: false }
      - { label: "Foto principal *", name: "image", widget: "image", choose_url: true, hint: "La foto de portada que se ve en la lista de productos. Es obligatoria.", required: false }
      - { label: "Fotos de la galería (opcional)", name: "images", widget: "image", choose_url: true, allow_multiple: true, required: false, hint: "Podés seleccionar VARIAS fotos a la vez. Se ven al hacer clic en el producto. Mínimo quedate solo con la principal si no tenés más." }
      # --- Paso 2: precios y categoría ---
      - { label: "Precio minorista ($)", name: "price", widget: "number", value_type: "int", min: 0, hint: "Precio que paga el cliente final.", required: false }
      - { label: "Precio mayorista ($)", name: "wholesalePrice", widget: "number", value_type: "int", min: 0, hint: "Precio para revendedoras. Si no trabajás con mayorista, poné el mismo precio.", required: false }
      - { label: "Categoría *", name: "cosmeticCategory", widget: "select", options: ["cremas", "perfumes", "ropa-interior"], hint: "Elegí dónde se va a mostrar el producto.", required: false }
      # --- Paso 3: descripción y detalles ---
      - { label: "Descripción", name: "description", widget: "text", required: false, hint: "Contá qué hace el producto y por qué vale la pena. Vacío = no se muestra." }
      - { label: "Etiqueta destacada (opcional)", name: "badge", widget: "string", hint: "Ej: 'Nuevo', 'Más Vendido', 'Exclusivo'. Vacío = sin etiqueta.", required: false }
      - { label: "Puntaje (0 a 5)", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, step: 0.1, default: 4.5, required: false, hint: "Estrellas que se muestran. Dejalo en 4.5 si no sabés." }
      - { label: "Cruelty Free", name: "crueltyFree", widget: "boolean", default: true }
      # --- Paso 4: técnico (no tocar) ---
      - { label: "Enlace corto (slug) *", name: "slug", widget: "string", hint: "En minúsculas, sin espacios ni acentos ni la extensión. Ej: crema-rosa-mosqueta. Es obligatorio: identifica el archivo y el link del producto. Poné el mismo nombre del producto separado por guiones." }
      - { label: "ID interno (opcional)", name: "id", widget: "string", hint: "Se usa para el carrito; si lo dejás vacío usa el slug automáticamente. No lo cambies en productos ya creados.", required: false }

  # Listados por categoría (mismos archivos, filtrados para que se vean agrupados)
  - name: "productos-cremas"
    label: "Productos ⤷ Cremas"
    label_singular: "Producto"
    folder: "src/data/productos"
    create: true
    delete: true
    identifier_field: "slug"
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    summary: "{{image}}  {{name}} — ${{price}}"
    filter: { field: "cosmeticCategory", value: "cremas" }
    editor:
      preview: false
      frame: false
    fields: *producto_fields

  - name: "productos-perfumes"
    label: "Productos ⤷ Perfumes"
    label_singular: "Producto"
    folder: "src/data/productos"
    create: true
    delete: true
    identifier_field: "slug"
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    summary: "{{image}}  {{name}} — ${{price}}"
    filter: { field: "cosmeticCategory", value: "perfumes" }
    editor:
      preview: false
      frame: false
    fields: *producto_fields

  - name: "productos-ropa-interior"
    label: "Productos ⤷ Ropa Interior"
    label_singular: "Producto"
    folder: "src/data/productos"
    create: true
    delete: true
    identifier_field: "slug"
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    summary: "{{image}}  {{name}} — ${{price}}"
    filter: { field: "cosmeticCategory", value: "ropa-interior" }
    editor:
      preview: false
      frame: false
    fields: *producto_fields