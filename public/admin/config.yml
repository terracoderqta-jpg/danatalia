# Configuración de Decap CMS para el sitio de Dana Talía
# Admin disponible en https://danatalia.netlify.app/admin/

backend:
  name: git-gateway
  branch: main

# Las fotos subidas desde el admin se guardan en public/uploads y
# Netlify las sirve en /uploads/...
media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://danatalia.netlify.app
display_url: https://danatalia.netlify.app
logo_url: /logo.png

collections:
  - name: "productos"
    label: "Productos"
    label_singular: "Producto"
    files:
      - name: "catalogo"
        label: "Catálogo de productos"
        file: "src/data/productos.json"
        description: "Editá el catálogo: fotos, precios, descripciones y etiquetas. Los cambios se publican solos al guardar."
        fields:
          - label: "Productos"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — Minorista ${{fields.price}} / Mayorista ${{fields.wholesalePrice}}"
            collapsed: false
            fields:
              - { label: "ID interno", name: "id", widget: "string", hint: "No lo cambies, se usa para el carrito.", required: false }
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string", hint: "URL amigable del producto.", required: false }
              - { label: "Descripción", name: "description", widget: "text", required: false }
              - { label: "Precio minorista ($ ARS)", name: "price", widget: "number", value_type: "int", min: 0 }
              - { label: "Precio mayorista ($ ARS)", name: "wholesalePrice", widget: "number", value_type: "int", min: 0 }
              - { label: "Foto del producto", name: "image", widget: "image", choose_url: true, hint: "Subí una foto desde tu compu o pegá un link." }
              - { label: "Categoría", name: "cosmeticCategory", widget: "select", options: ["skincare", "maquillaje", "perfumes", "sets"] }
              - { label: "Etiqueta (opcional)", name: "badge", widget: "string", hint: "Ej: 'Más Vendido', 'Nuevo', 'Exclusivo'. Dejalo vacío si no querés.", required: false }
              - { label: "Puntaje", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, step: 0.1, default: 4.5, required: false }
              - { label: "Cruelty Free", name: "crueltyFree", widget: "boolean", default: true }
