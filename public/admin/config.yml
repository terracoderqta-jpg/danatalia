# Configuración de Decap CMS para el sitio de Dana Talía
# Admin disponible en https://danatalia.netlify.app/admin/

backend:
  name: git-gateway
  branch: main

# Idioma de la interfaz del panel
locale: es

# Las fotos subidas desde el admin se guardan en public/uploads y
# Netlify las sirve en /uploads/...
media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://danatalia.netlify.app
display_url: https://danatalia.netlify.app
logo_url: /logo.png

collections:
  # ============ BANNER ============
  - name: "banner"
    label: "Banner principal"
    label_singular: "Banner"
    files:
      - name: "banner_data"
        label: "Contenido del banner"
        file: "src/data/banner.json"
        editor:
          preview: false
        fields:
          - label: "Barra superior"
            name: "topBar"
            widget: "object"
            fields:
              - { label: "Texto", name: "text", widget: "string" }
              - { label: "Texto destacado", name: "highlight", widget: "string" }
          - { label: "Etiqueta 1", name: "badge1", widget: "string" }
          - { label: "Etiqueta 2", name: "badge2", widget: "string" }
          - { label: "Título (primera parte)", name: "title", widget: "string" }
          - { label: "Título (palabras en terracota)", name: "titleHighlight", widget: "string" }
          - { label: "Subtítulo", name: "subtitle", widget: "text" }
          - { label: "Foto principal del banner", name: "heroImage", widget: "image", choose_url: true }
          - { label: "Texto alternativo de la foto", name: "heroImageAlt", widget: "string", required: false }
          - label: "Tarjeta destacada (sobre la foto)"
            name: "featured"
            widget: "object"
            fields:
              - { label: "Etiqueta", name: "label", widget: "string" }
              - { label: "Nombre del producto", name: "name", widget: "string" }
              - { label: "Descripción", name: "description", widget: "string" }
          - label: "Tarjeta flotante"
            name: "floatingCard"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "string" }
              - { label: "Emoji", name: "emoji", widget: "string" }
          - { label: "Sello flotante (arriba a la derecha)", name: "floatingBadge", widget: "string" }
          - label: "Estadísticas"
            name: "stats"
            widget: "list"
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { label: "Valor", name: "value", widget: "string" }
              - { label: "Etiqueta", name: "label", widget: "string" }

  # ============ CATEGORÍAS ============
  - name: "categorias"
    label: "Categorías"
    label_singular: "Categoría"
    folder: "src/data/categorias"
    create: false
    identifier_field: "key"
    format: "json"
    extension: "json"
    slug: "{{key}}"
    summary: "{{label}}"
    editor:
      preview: false
    fields:
      - { label: "Clave interna", name: "key", widget: "select", options: ["skincare", "maquillaje", "perfumes", "sets"], hint: "Debe coincidir con la categoría de los productos." }
      - { label: "Nombre", name: "label", widget: "string" }
      - { label: "Foto de la categoría", name: "image", widget: "image", choose_url: true }

  # ============ PRODUCTOS ============
  - name: "productos"
    label: "Productos"
    label_singular: "Producto"
    folder: "src/data/productos"
    create: true
    identifier_field: "id"
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    summary: "{{name}} — Minorista ${{price}} / Mayorista ${{wholesalePrice}}"
    description: "Edita foto, precios, nombre y descripción de cada producto. Los cambios se publican solos al guardar."
    editor:
      preview: false
    fields:
      - { label: "Foto del producto", name: "image", widget: "image", choose_url: true, hint: "Subí una foto desde tu compu o pegá un link." }
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "URL amigable del producto (sin espacios, en minúsculas)." }
      - { label: "Precio minorista ($ ARS)", name: "price", widget: "number", value_type: "int", min: 0 }
      - { label: "Precio mayorista ($ ARS)", name: "wholesalePrice", widget: "number", value_type: "int", min: 0 }
      - { label: "Categoría", name: "cosmeticCategory", widget: "select", options: ["skincare", "maquillaje", "perfumes", "sets"] }
      - { label: "Etiqueta (opcional)", name: "badge", widget: "string", hint: "Ej: 'Más Vendido', 'Nuevo', 'Exclusivo'. Dejalo vacío si no querés.", required: false }
      - { label: "Descripción", name: "description", widget: "text", required: false }
      - { label: "Puntaje", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, step: 0.1, default: 4.5, required: false }
      - { label: "Cruelty Free", name: "crueltyFree", widget: "boolean", default: true }
      - { label: "ID interno", name: "id", widget: "string", hint: "No lo cambies, se usa para el carrito.", required: false }