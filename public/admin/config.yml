# Configuración de Decap CMS para el sitio de Dana Talía
# Admin disponible en https://danatalia.pages.dev/admin/

backend:
  name: github
  repo: terracoderqta-jpg/danatalia
  branch: main
  base_url: https://danatalia.pages.dev
  auth_endpoint: /api/auth

# Idioma de la interfaz del panel
locale: es

# Las fotos subidas desde el admin se guardan en public/uploads y
# el sitio las sirve en /uploads/...
media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://danatalia.pages.dev
display_url: https://danatalia.pages.dev
logo_url: /logo.png

# Desactiva los enlaces de "vista previa de deploy" (los elementos no tienen página propia)
show_preview_links: false

# Desactiva la vista previa del editor para todas las colecciones
editor:
  preview: false

collections:
  # ============ BANNER ============
  - name: "banner"
    label: "Banner principal"
    label_singular: "Banner"
    files:
      - name: "banner_data"
        label: "Contenido del banner"
        file: "src/data/banner.json"
        editor:
          preview: false
        fields:
          - label: "Barra superior"
            name: "topBar"
            widget: "object"
            fields:
              - { label: "Texto", name: "text", widget: "string", required: false }
              - { label: "Texto destacado", name: "highlight", widget: "string", required: false }
          - { label: "Etiqueta 1", name: "badge1", widget: "string", required: false }
          - { label: "Etiqueta 2", name: "badge2", widget: "string", required: false }
          - { label: "Título (primera parte)", name: "title", widget: "string", required: false }
          - { label: "Título (palabras en terracota)", name: "titleHighlight", widget: "string", required: false }
          - { label: "Subtítulo", name: "subtitle", widget: "text", required: false }
          - { label: "Foto principal del banner", name: "heroImage", widget: "image", choose_url: true, required: false }
          - { label: "Texto alternativo de la foto", name: "heroImageAlt", widget: "string", required: false }
          - label: "Tarjeta destacada (sobre la foto)"
            name: "featured"
            widget: "object"
            fields:
              - { label: "Etiqueta", name: "label", widget: "string", required: false }
              - { label: "Nombre del producto", name: "name", widget: "string", required: false }
              - { label: "Descripción", name: "description", widget: "string", required: false }
          - label: "Tarjeta flotante"
            name: "floatingCard"
            widget: "list"
            min: 0
            max: 1
            summary: "{{fields.title}}"
            hint: "Se muestra una tarjeta flotante sobre el banner. Para ocultarla, presioná el botón para vaciarla (si no hay elementos, no aparece)."
            fields:
              - { label: "Título", name: "title", widget: "string", required: false }
              - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
              - { label: "Emoji", name: "emoji", widget: "string", required: false }
          - { label: "Sello flotante (arriba a la derecha)", name: "floatingBadge", widget: "string", required: false }
          - label: "Estadísticas"
            name: "stats"
            widget: "list"
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { label: "Valor", name: "value", widget: "string", required: false }
              - { label: "Etiqueta", name: "label", widget: "string", required: false }

  # ============ CATEGORÍAS ============
  - name: "categorias"
    label: "Categorías"
    label_singular: "Categoría"
    folder: "src/data/categorias"
    create: true
    delete: true
    identifier_field: "key"
    format: "json"
    extension: "json"
    slug: "{{key}}"
    summary: "{{label}}"
    editor:
      preview: false
    fields:
      - { label: "Clave interna", name: "key", widget: "string", hint: "En minúsculas, sin espacios ni acentos. Ej: accesorios. No la cambies si la categoría ya tiene productos asignados.", required: false }
      - { label: "Nombre", name: "label", widget: "string", required: false }
      - { label: "Foto de la categoría", name: "image", widget: "image", choose_url: true, required: false }

  # ============ PRODUCTOS ============
  # Mismos archivos (src/data/productos), pero separados por categoría en el panel
  - name: "productos"
    label: "Productos — Todos"
    label_singular: "Producto"
    folder: "src/data/productos"
    create: true
    delete: true
    identifier_field: "slug"
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    summary: "{{image}}  {{name}} — ${{price}}"
    description: "Edita foto, precios, nombre y descripción de cada producto. Los cambios se publican solos al guardar."
    editor:
      preview: false
      frame: false
    fields: &producto_fields
      - { label: "Nombre del producto", name: "name", widget: "string", hint: "El nombre que se muestra en la tienda. Ej: 'Crema Rosa Mosqueta'.", required: false }
      - { label: "Foto principal", name: "image", widget: "image", choose_url: true, hint: "La foto que se ve en la lista de productos.", required: false }
      - label: "Galería (fotos extra)"
        name: "images"
        widget: "list"
        required: false
        label_singular: "Foto"
        summary: "{{image}} {{fields.image}}"
        hint: "Fotos adicionales que se ven al hacer clic en el producto. Tocá '+ Foto' para agregar cada una."
        field: { label: "Foto", name: "image", widget: "image", choose_url: true, allow_multiple: true, required: false }
      - { label: "Precio minorista ($)", name: "price", widget: "number", value_type: "int", min: 0, hint: "Precio que paga el cliente final.", required: false }
      - { label: "Precio mayorista ($)", name: "wholesalePrice", widget: "number", value_type: "int", min: 0, hint: "Precio para revendedoras. Si no trabajás con mayorista, poné el mismo precio.", required: false }
      - { label: "Categoría", name: "cosmeticCategory", widget: "select", options: ["cremas", "perfumes", "ropa-interior"], hint: "Elegí la categoría del producto.", required: false }
      - { label: "Descripción", name: "description", widget: "text", required: false, hint: "Contá qué hace el producto y por qué vale la pena." }
      - { label: "Etiqueta destacada (opcional)", name: "badge", widget: "string", hint: "Ej: 'Nuevo', 'Más Vendido', 'Exclusivo'. Vacío = sin etiqueta.", required: false }
      - { label: "Puntaje (0 a 5)", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, step: 0.1, default: 4.5, required: false, hint: "Estrellas que se muestran. Dejalo en 4.5 si no sabés." }
      - { label: "Cruelty Free", name: "crueltyFree", widget: "boolean", default: true }
      - { label: "Enlace corto (slug)", name: "slug", widget: "string", hint: "En minúsculas, sin espacios ni acentos ni la extensión. Ej: crema-rosa-mosqueta. Es obligatorio: identifica la foto/link del producto." }
      - { label: "ID interno", name: "id", widget: "string", hint: "Opcional. Se usa para el carrito; si lo dejás vacío funciona igual.", required: false }

  # Listados por categoría (mismos archivos, filtrados para que se vean agrupados)
  - name: "productos-cremas"
    label: "Productos ⤷ Cremas"
    label_singular: "Producto"
    folder: "src/data/productos"
    create: true
    delete: true
    identifier_field: "slug"
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    summary: "{{image}}  {{name}} — ${{price}}"
    filter: { field: "cosmeticCategory", value: "cremas" }
    editor:
      preview: false
      frame: false
    fields: *producto_fields

  - name: "productos-perfumes"
    label: "Productos ⤷ Perfumes"
    label_singular: "Producto"
    folder: "src/data/productos"
    create: true
    delete: true
    identifier_field: "slug"
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    summary: "{{image}}  {{name}} — ${{price}}"
    filter: { field: "cosmeticCategory", value: "perfumes" }
    editor:
      preview: false
      frame: false
    fields: *producto_fields

  - name: "productos-ropa-interior"
    label: "Productos ⤷ Ropa Interior"
    label_singular: "Producto"
    folder: "src/data/productos"
    create: true
    delete: true
    identifier_field: "slug"
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    summary: "{{image}}  {{name}} — ${{price}}"
    filter: { field: "cosmeticCategory", value: "ropa-interior" }
    editor:
      preview: false
      frame: false
    fields: *producto_fields